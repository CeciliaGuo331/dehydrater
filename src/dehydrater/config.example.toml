# dehydrater 配置文件
#
# [providers.<渠道名>]  渠道：怎么连接一个 API 账号。每个渠道对应一把密钥。
# [tasks.<任务名>]      任务：每个调用 API 的步骤，各自用哪个渠道、哪个模型。
#
# 密钥不写在这里。按渠道名查找，顺序为：
#   1. 环境变量 DEHYDRATER_KEY_<渠道名大写，- 换成 _>，例如 DEHYDRATER_KEY_DEHYDRATE
#   2. .env 文件中的同名变量
#   3. 系统钥匙串，用 `dehydrater key set <渠道名>` 写入
#
# 下面为每个任务单独定义了一个渠道，因此每个任务都要单独填一把密钥。
# 如果几个任务想共用同一把密钥，让它们的 provider 指向同一个渠道即可。

# ---- 渠道 ----

# 语音识别：豆包语音控制台的 API Key（请求头 X-Api-Key）
[providers.transcribe]
kind = "volcengine-asr"
api = "standard"                        # standard：提交后轮询；flash：极速版（需另外开通）

# 以下三个都是火山方舟（兼容 OpenAI 接口），密钥来自方舟控制台
[providers.dehydrate]
kind = "openai-compatible"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
max_concurrency = 4                     # 脱水是分块并发调用的

[providers.outline]
kind = "openai-compatible"
base_url = "https://ark.cn-beijing.volces.com/api/v3"

[providers.write-notes]
kind = "openai-compatible"
base_url = "https://ark.cn-beijing.volces.com/api/v3"
max_concurrency = 4                     # 笔记是按章并发撰写的

# ---- 任务 ----

# 转写课堂录音 → raw.md
[tasks.transcribe]
provider = "transcribe"
model = "volc.seedasr.auc"              # 火山 ASR 的 model 填资源 ID：录音文件识别 2.0（1.0 为 volc.bigasr.auc）

# 脱水：去口癖、重复、闲聊，修正识别错误 → dehydrated.md
[tasks.dehydrate]
provider = "dehydrate"
model = "doubao-seed-2-1-lite-260915"   # 以方舟控制台中开通的模型 ID 为准
# 方舟的豆包模型默认开启深度思考，又慢又贵；逐段脱水不需要
extra_body = { thinking = { type = "disabled" } }

# 大纲：把课件和讲课内容分成章，并生成概览、术语、课堂通知
[tasks.outline]
provider = "outline"
model = "doubao-seed-2-1-pro-260915"
extra_body = { thinking = { type = "disabled" } }

# 笔记：按章撰写以课件为主线、融入课堂讲解的笔记 → notes.md
[tasks.write_notes]
provider = "write-notes"
model = "doubao-seed-2-1-pro-260915"
extra_body = { thinking = { type = "disabled" } }
